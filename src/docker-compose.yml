version: '3.8'

services:
  ambev.developerevaluation.webapi:
    container_name: ambev_developer_evaluation_webapi
    image: ${DOCKER_REGISTRY-}ambevdeveloperevaluationwebapi
    build:
      context: .
      dockerfile: src/Ambev.DeveloperEvaluation.WebApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_HTTPS_PORTS: 8081
      ASPNETCORE_URLS: http://localhost:8080;http://localhost:8081;
      REDIS_HOST: 10.5.0.6,password=ev@luAt10n,
      MONGO_CONNECTION_STRING: mongodb://10.5.0.7:27017
      MONGO_DATABASE: CARTS_DB
      MONGO_CARTS_COLLECTION: CARTS
      CONNECTION_STRING: "Host=10.5.0.8:5416;Database=developer_evaluation;Username=developer;Password=ev@luAt10n;TrustServerCertificate=True"

    ports:
      - "8080:8080"
      - "8081:8081"
    networks:
      backend:
        ipv4_address: 10.5.0.9
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro

  ambev.developerevaluation.database:
    container_name: ambev_developer_evaluation_database
    image: postgres:13

    environment:
      PGUSER: developer 
      POSTGRES_DB: developer_evaluation
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: ev@luAt10n
    ports:
      - "5416:5432"
      - "5432"
    networks:
      backend:
        ipv4_address: 10.5.0.8
    restart: unless-stopped

  ambev.developerevaluation.nosql:
    container_name: ambev_developer_evaluation_nosql 
    image: mongo:8.0    
    ports:
      - "27017:27017"
    networks:
      backend:
        ipv4_address: 10.5.0.7

  ambev.developerevaluation.cache:
    container_name: ambev_developer_evaluation_cache 
    image: redis:7.4.1-alpine     
    command: redis-server --requirepass ev@luAt10n
    ports:
       - "6379:6379"
    networks:
      backend:
        ipv4_address: 10.5.0.6
networks:
  backend:
    driver: bridge
    ipam:
     config:
       - subnet: 10.5.0.0/16
         gateway: 10.5.0.1